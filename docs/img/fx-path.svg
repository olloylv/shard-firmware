<text x="382" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">drv</text>
<rect x="414" y="262" width="48" height="32" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="438" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">glt</text>
<rect x="470" y="262" width="48" height="32" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="494" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">cmp</text>
