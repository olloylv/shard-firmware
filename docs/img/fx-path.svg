<path d="M340 630 L340 658" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="230" y="660" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
