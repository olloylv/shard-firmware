<svg xmlns="http://www.w3.org/2000/svg" width="680" height="740" viewBox="0 0 680 740" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img">
<title>SHARD FX bus and output stage</title>
